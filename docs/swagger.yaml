info:
  contact: {}
  description: API documentation for Selah Service
  title: Selah Service API
  version: "1.0"
paths:
  /api/healthz:
    get:
      consumes:
      - application/json
      description: Check service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
      summary: Health check
      tags:
      - API / etc
  /api/v1/sync/pull:
    get:
      consumes:
      - application/json
      description: Pull records updated since specified timestamp across all entities
      parameters:
      - description: Timestamp (int64 or datetime) to query records updated since
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-github_com_bryanfks-dev_selah_internal_model_SyncPullResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
      summary: Sync pull delta
      tags:
      - API / sync
  /api/v1/sync/push:
    post:
      consumes:
      - application/json
      description: Push batch of entities to synchronize with server
      parameters:
      - description: Sync push batch request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.SyncPushRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-github_com_bryanfks-dev_selah_internal_model_SyncPushResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bryanfks-dev_selah_internal_model.APIResponse-any'
      summary: Sync push batch
      tags:
      - API / sync
