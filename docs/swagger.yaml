info:
  contact: {}
  description: API documentation for Logos Service
  title: Logos Service API
  version: "1.0"
paths:
  /api/attachments/{id}/file:
    put:
      consumes:
      - application/octet-stream
      description: Stream raw binary attachment file, verify SHA-256 hash, store atomically,
        and mark uploaded
      parameters:
      - description: Attachment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Expected SHA-256 hex digest
        in: header
        name: X-Content-Hash
        required: true
        type: string
      - description: Raw binary attachment file stream
        format: binary
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse-response_UploadSermonNoteAttachmentFileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse-any'
      summary: Upload attachment binary file
      tags:
      - API / Sermon Note / Attachments
  /api/healthz:
    get:
      consumes:
      - application/json
      description: Check service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse-any'
      summary: Health check
      tags:
      - API / Etc
  /api/sync/changes:
    post:
      consumes:
      - application/json
      description: Push batch of entities to synchronize with server
      parameters:
      - description: Sync push batch request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SyncPushChangesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse-response_SyncPushChangesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse-any'
      summary: Sync by pushing changes
      tags:
      - API / Sync
  /api/sync/changes/{since}:
    get:
      consumes:
      - application/json
      description: Pull records updated since specified datetime across all entities
      parameters:
      - description: RFC3339 or YYYY-MM-DD datetime to query records updated since
        in: path
        name: since
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.APIResponse-response_SyncPullChangesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.APIResponse-any'
      summary: Sync by pulling delta of changes
      tags:
      - API / Sync
swagger: "2.0"
